<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Kanti Prasoona, software engineer in Hyderabad building RAG systems, AI agents and MCP servers.">
<title>Kanti Prasoona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Ramaraja&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; }
  /* Layout: one peach stage. Illustration anchored bottom-left, intro text centred on the right,
     a pink name tab hanging from the top edge, social squares top-left, plant bottom-right.
     Deliberately single-theme: the illustration's peach-and-pink world doesn't invert. */
  :root {
    --peach: #FEEDE4;
    --pink: #EE296B;
    --pink-press: #C9174F;
    --ink: #161613;
    --ink-soft: #4A4540;
    --cream: #FEEDE4;
    --display: 'Ramaraja', Georgia, 'Times New Roman', serif;
    --body: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --gutter: clamp(16px, 4.5vw, 72px);
    color-scheme: light;
  }
  html, body { background: var(--peach); color: var(--ink); }
  body { font-family: var(--body); -webkit-font-smoothing: antialiased; }

  .stage {
    position: relative;
    max-width: 1440px;
    margin-inline: auto;
    padding-inline: var(--gutter);
    padding-block: clamp(40px, 6vw, 96px) 0;
    overflow: hidden;
  }



  .hero {
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
    align-items: center;
    gap: clamp(16px, 3vw, 56px);
  }
  .scene { align-self: end; min-width: 0; }
  .scene-svg { display: block; width: 100%; height: auto; max-width: 100%; }

  .intro { min-width: 0; padding-block-end: clamp(48px, 7vw, 120px); }
  h1 {
    margin: 0;
    font: 400 clamp(42px, 5.6vw, 80px)/1.02 var(--display);
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .role {
    margin: clamp(10px, 1.2vw, 18px) 0 0;
    font: 600 clamp(19px, 2.1vw, 29px)/1.25 var(--body);
    color: var(--pink);
    text-wrap: balance;
  }
  .blurb {
    max-width: 44ch;
    margin: clamp(14px, 1.6vw, 22px) 0 0;
    font-size: clamp(15px, 1.25vw, 18px);
    line-height: 1.6;
  }

  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  .plant {
    position: absolute;
    right: clamp(16px, 7vw, 120px);
    bottom: 0;
    width: clamp(70px, 9.5vw, 140px);
    height: auto;
    pointer-events: none;
  }

  .credit {
    max-width: 1440px;
    margin-inline: auto;
    padding: 14px var(--gutter) 22px;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .credit a { color: inherit; }

  /* ---------- motion ---------- */
  .hand { transform-origin: 0 0; animation: type 1.9s ease-in-out infinite; }
  @keyframes type {
    0%, 100% { transform: rotate(0deg); }
    7%  { transform: rotate(3.2deg); }
    14% { transform: rotate(0deg); }
    21% { transform: rotate(2.4deg); }
    28% { transform: rotate(0deg); }
    35% { transform: rotate(3deg); }
    42% { transform: rotate(0deg); }
    49% { transform: rotate(2.2deg); }
    56% { transform: rotate(0deg); }
  }

  .glow { opacity: 0.45; animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.95; }
  }
  .lid { animation: lid 2.6s ease-in-out infinite; }
  @keyframes lid {
    0%, 100% { fill: #EE296B; }
    50% { fill: #FF5E97; }
  }

  .steam path { opacity: 0; animation: steam 3s ease-out infinite; }
  .steam .s2 { animation-delay: 1s; }
  .steam .s3 { animation-delay: 2s; }
  @keyframes steam {
    0%   { transform: translateY(3px); opacity: 0; }
    25%  { opacity: 1; }
    100% { transform: translateY(-7px); opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hand, .glow, .lid, .steam path { animation: none; }
    .glow { opacity: 0.7; }
    .steam path { opacity: 0.9; }
  }

  /* ---------- narrow screens: text first, illustration below ---------- */
  @media (max-width: 760px) {
    .stage { padding-block-start: 40px; }
    .hero { grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .intro { order: -1; padding-block-end: 8px; }
    .plant { display: none; }
  }
</style>
</head>
